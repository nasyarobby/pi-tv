name: pi_tv_server
description: Pi TV server - plays YouTube in Chromium (CDP) and local files in mpv.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.6.0

dependencies:
  args: ^2.5.0
  crypto: ^3.0.3
  http: ^1.2.0
  path: ^1.9.0
  pi_tv_shared:
    path: ../../packages/pi_tv_shared
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_static: ^1.1.2
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
